<!doctype html>
<html lang="id">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Classify Osteoporosis API</title>
    <link rel="stylesheet" href="{% url 'docs_asset' filename='swagger-ui.css' %}">
  </head>
  <body>
    <div id="swagger-ui"></div>
    <script src="{% url 'docs_asset' filename='swagger-ui-bundle.js' %}"></script>
    <script>
      window.ui = SwaggerUIBundle({
        url: "{% url 'openapi' %}",
        requestInterceptor: (request) => {
          if (!['GET', 'HEAD', 'OPTIONS'].includes((request.method || 'GET').toUpperCase())) {
            const cookie = document.cookie.split('; ').find(value => value.startsWith('csrftoken='));
            if (cookie) request.headers['X-CSRFToken'] = decodeURIComponent(cookie.split('=')[1]);
          }
          return request;
        },
        dom_id: '#swagger-ui',
        deepLinking: true,
        displayRequestDuration: true,
        validatorUrl: null,
        presets: [SwaggerUIBundle.presets.apis],
        layout: 'BaseLayout'
      });
    </script>
  </body>
</html>
